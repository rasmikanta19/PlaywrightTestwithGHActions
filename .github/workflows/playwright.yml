name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. Check out the repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Install npm dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Install Playwright browsers (chromium + firefox) with OS dependencies
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # 5. Run Playwright tests
      - name: Run Playwright tests
        run: npx playwright test

      # 6. Upload the HTML report as an artifact (available for 30 days)
      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()          # upload even when tests fail
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

          
              # 7. Send email notification with test result
      - name: Send email notification
        uses: dawidd6/action-send-mail@v3
        if: always()
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Playwright Tests ${{ job.status == 'success' && 'PASSED ✅' || 'FAILED ❌' }} — ${{ github.repository }}"
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_USERNAME }}
          body: |
            Playwright test run completed.

            Status   : ${{ job.status }}
            Repo     : ${{ github.repository }}
            Branch   : ${{ github.ref_name }}
            Commit   : ${{ github.sha }}
            Triggered: ${{ github.event_name }}
            Run URL  : https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
